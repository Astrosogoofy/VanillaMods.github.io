<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VanillaMods</title>

    <!-- FUTURISTIC FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        html,
        body {
            width: 100%;
            min-height: 100%;
            background: #000;
            font-family: Arial, sans-serif;
        }


        body {
            overflow-x: hidden;
            overflow-y: auto;
        }


        /* =========================
           TOP NAVIGATION
        ========================= */

        .navbar {
            position: fixed;
            top: 0;
            left: 0;

            width: 100%;
            height: 64px;

            z-index: 1000;

            background:
                linear-gradient(
                    180deg,
                    rgba(30, 12, 48, 0.96),
                    rgba(14, 6, 25, 0.92)
                );

            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);

            border-bottom:
                1px solid rgba(170, 80, 255, 0.16);

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.45);
        }


        .nav-inner {
            width: 100%;
            height: 100%;

            padding: 0 28px;

            display: flex;
            align-items: center;
        }


        /* =========================
           WEBSITE LOGO
        ========================= */

        .site-logo-link {
            position: absolute;

            left: 28px;

            top: 50%;

            transform:
                translateY(-50%);
        }


        .site-logo {
            width: 44px;
            height: 44px;

            object-fit: contain;

            display: block;

            transition:
                transform 0.25s ease,
                filter 0.25s ease;
        }


        .site-logo-link:hover .site-logo {
            transform: scale(1.08);

            filter:
                drop-shadow(
                    0 0 10px
                    rgba(170, 80, 255, 0.8)
                );
        }


        /* =========================
           NAVIGATION
        ========================= */

        .nav-links {
            width: 100%;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 34px;
        }


        .nav-links a {
            position: relative;

            display: inline-flex;

            align-items: center;

            gap: 8px;

            padding: 8px 2px;

            color:
                rgba(225, 215, 240, 0.72);

            text-decoration: none;

            font-size: 15px;

            font-weight: 500;

            transition:
                color 0.25s ease,
                transform 0.25s ease;
        }


        .nav-links a:hover {
            color: white;

            transform:
                translateY(-1px);
        }


        .nav-links a::after {
            content: "";

            position: absolute;

            left: 0;
            bottom: 0;

            width: 0;
            height: 2px;

            border-radius: 10px;

            background:
                linear-gradient(
                    90deg,
                    #9b5cff,
                    #d77cff
                );

            box-shadow:
                0 0 8px
                rgba(170, 80, 255, 0.6);

            transition:
                width 0.25s ease;
        }


        .nav-links a:hover::after {
            width: 100%;
        }


        .icon {
            width: 19px;
            height: 19px;

            flex-shrink: 0;

            color: currentColor;
        }


        /* =========================
           GET MODS BUTTON
        ========================= */

        .get-mods-nav {
            margin-left: 0;

            position: relative;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            height: 44px;

            min-width: 120px;

            padding: 0 24px;

            border-radius: 12px;

            border:
                1px solid
                rgba(190, 100, 255, 0.8);

            background:
                linear-gradient(
                    135deg,
                    rgba(75, 20, 115, 0.8),
                    rgba(35, 10, 60, 0.9)
                );

            color: white !important;

            font-size: 14px !important;

            font-weight: 600 !important;

            text-decoration: none;

            box-shadow:
                0 0 12px
                rgba(150, 60, 255, 0.35),

                0 0 28px
                rgba(120, 40, 220, 0.18);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                border-color 0.25s ease,
                background 0.25s ease;
        }


        .get-mods-nav::after {
            display: none;
        }


        .get-mods-nav:hover {

            transform:
                translateY(-2px)
                scale(1.03);

            border-color:
                rgba(225, 170, 255, 1);

            background:
                linear-gradient(
                    135deg,
                    rgba(105, 30, 160, 0.9),
                    rgba(45, 12, 75, 0.95)
                );

            box-shadow:

                0 0 18px
                rgba(175, 80, 255, 0.75),

                0 0 45px
                rgba(145, 50, 255, 0.4);
        }


        .get-mods-nav:active {

            transform:
                scale(0.97);

            box-shadow:
                0 0 30px
                rgba(190, 90, 255, 0.9);
        }


        /* =========================
           HOME HERO
        ========================= */

        #home {
            position: relative;

            width: 100%;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            padding:
                100px 20px 40px;

            z-index: 5;
        }


        .hero-content {
            position: relative;

            z-index: 10;

            max-width: 900px;

            animation:
                heroFadeIn
                1.2s
                ease
                forwards;
        }


        .hero-title {
            font-family:
                "Orbitron",
                Arial,
                sans-serif;

            font-size:
                clamp(48px, 8vw, 100px);

            font-weight: 800;

            letter-spacing: 4px;

            color: white;

            text-transform: uppercase;

            text-shadow:

                0 0 10px
                rgba(190, 100, 255, 0.9),

                0 0 25px
                rgba(150, 50, 255, 0.75),

                0 0 60px
                rgba(110, 30, 220, 0.5);

            margin-bottom: 18px;
        }


        .hero-title span {
            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #d7a7ff,
                    #a85cff,
                    #ffffff
                );

            background-size:
                250% auto;

            -webkit-background-clip: text;
            background-clip: text;

            -webkit-text-fill-color:
                transparent;

            animation:
                titleGlow
                5s
                linear
                infinite;
        }


        .hero-subtitle {
            font-family:
                "Orbitron",
                Arial,
                sans-serif;

            font-size:
                clamp(14px, 2vw, 21px);

            font-weight: 500;

            letter-spacing: 2px;

            color:
                rgba(235, 220, 250, 0.78);

            text-shadow:
                0 0 12px
                rgba(170, 80, 255, 0.45);
        }


        @keyframes heroFadeIn {

            from {
                opacity: 0;

                transform:
                    translateY(25px);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        @keyframes titleGlow {

            0% {
                background-position:
                    0% center;
            }

            50% {
                background-position:
                    100% center;
            }

            100% {
                background-position:
                    0% center;
            }
        }


        /* =========================
           SPACE BACKGROUND
        ========================= */

        #space {
            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            z-index: 0;

            pointer-events: none;

            background:

                radial-gradient(
                    ellipse at 12% 22%,
                    rgba(115, 0, 220, 0.24),
                    rgba(70, 0, 130, 0.10) 20%,
                    transparent 45%
                ),

                radial-gradient(
                    ellipse at 88% 58%,
                    rgba(140, 0, 240, 0.20),
                    rgba(80, 0, 150, 0.08) 22%,
                    transparent 48%
                ),

                radial-gradient(
                    ellipse at 45% 105%,
                    rgba(100, 0, 220, 0.20),
                    transparent 45%
                ),

                radial-gradient(
                    ellipse at 62% 15%,
                    rgba(150, 40, 255, 0.13),
                    transparent 35%
                ),

                #000;
        }


        /* =========================
           PURPLE CLOUDS
        ========================= */

        .purple-cloud {
            position: absolute;

            border-radius: 50%;

            pointer-events: none;

            filter: blur(70px);

            opacity: 0.35;
        }


        .cloud1 {
            width: 420px;
            height: 200px;

            left: -100px;
            top: 18%;

            background:
                rgba(110, 0, 230, 0.45);

            transform:
                rotate(-25deg);
        }


        .cloud2 {
            width: 500px;
            height: 220px;

            right: -130px;
            top: 52%;

            background:
                rgba(145, 0, 255, 0.34);

            transform:
                rotate(20deg);
        }


        .cloud3 {
            width: 400px;
            height: 180px;

            left: 30%;
            bottom: -100px;

            background:
                rgba(85, 0, 210, 0.34);
        }


        .cloud4 {
            width: 300px;
            height: 150px;

            left: 58%;
            top: 8%;

            background:
                rgba(140, 20, 255, 0.20);

            transform:
                rotate(-15deg);
        }


        /* =========================
           STARS
        ========================= */

        .star {
            position: absolute;

            width: 2px;
            height: 2px;

            background: white;

            border-radius: 50%;

            box-shadow:
                0 0 5px white;

            animation:
                twinkle
                var(--twinkle-time)
                ease-in-out
                infinite
                alternate;

            opacity:
                var(--opacity);
        }


        .star.small {
            width: 1px;
            height: 1px;

            box-shadow:
                0 0 3px white;
        }


        .star.big {
            width: 3px;
            height: 3px;

            box-shadow:
                0 0 8px white,
                0 0 15px
                rgba(190, 120, 255, 0.65);
        }


        @keyframes twinkle {

            0% {
                opacity: 0.02;

                transform:
                    scale(0.6);
            }

            50% {
                opacity:
                    var(--opacity);

                transform:
                    scale(1);
            }

            100% {
                opacity: 0.02;

                transform:
                    scale(0.6);
            }
        }


        /* =========================
           MOVING STARS
        ========================= */

        .moving-star {
            position: absolute;

            width: 3px;
            height: 3px;

            background: white;

            border-radius: 50%;

            box-shadow:
                0 0 8px white,
                0 0 16px
                rgba(180, 90, 255, 0.85);

            animation:
                moveStar
                var(--move-time)
                linear
                forwards;
        }


        @keyframes moveStar {

            from {
                transform:
                    translate(0, 0);

                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            80% {
                opacity: 1;
            }

            to {
                transform:
                    translate(
                        var(--move-x),
                        var(--move-y)
                    );

                opacity: 0;
            }
        }


        /* =========================
           SHOOTING STARS
        ========================= */

        .shooting-star {
            position: absolute;

            width: 130px;
            height: 2px;

            background:
                linear-gradient(
                    to right,
                    transparent,
                    rgba(170, 70, 255, 0.45),
                    white
                );

            border-radius: 50%;

            box-shadow:
                0 0 8px white,
                0 0 18px
                rgba(170, 70, 255, 0.9);

            transform:
                rotate(35deg);

            animation:
                shooting
                1.2s
                linear
                forwards;
        }


        @keyframes shooting {

            from {
                transform:
                    translate(0, 0)
                    rotate(35deg);

                opacity: 0;
            }

            15% {
                opacity: 1;
            }

            to {
                transform:
                    translate(500px, 350px)
                    rotate(35deg);

                opacity: 0;
            }
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .navbar {
                height: 58px;
            }


            .nav-inner {
                padding: 0 10px;
            }


            .site-logo-link {
                left: 10px;
            }


            .site-logo {
                width: 38px;
                height: 38px;
            }


            .nav-links {
                gap: 13px;
            }


            .nav-links a {
                font-size: 11px;
                gap: 4px;
            }


            .icon {
                width: 16px;
                height: 16px;
            }


            .get-mods-nav {
                height: 40px;

                min-width: 105px;

                padding: 0 16px;

                font-size: 11px !important;
            }


            .hero-title {
                letter-spacing: 2px;
            }


            .hero-subtitle {
                letter-spacing: 1px;
                line-height: 1.6;
            }
        }

    </style>
</head>


<body>


    <!-- =========================
         TOP NAVIGATION
    ========================= -->

    <header class="navbar">

        <div class="nav-inner">


            <!-- LOGO -->

            <a
                href="#home"
                class="site-logo-link"
            >

                <img
                    src="VM.png"
                    alt="VanillaMods Logo"
                    class="site-logo"
                >

            </a>


            <!-- NAVIGATION -->

            <nav class="nav-links">


                <!-- HOME -->

                <a href="#home">

                    <svg
                        class="icon"
                        viewBox="0 0 24 24"
                        fill="none"
                    >

                        <path
                            d="M3 10.8L12 3l9 7.8V21h-6v-6H9v6H3V10.8Z"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />

                    </svg>

                    <span>Home</span>

                </a>


                <!-- DOWNLOADS -->

                <a href="#downloads">

                    <svg
                        class="icon"
                        viewBox="0 0 24 24"
                        fill="none"
                    >

                        <path
                            d="M12 3v11"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                        />

                        <path
                            d="M7.5 10.5L12 15l4.5-4.5"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />

                        <path
                            d="M5 20h14"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                        />

                    </svg>

                    <span>Downloads</span>

                </a>


                <!-- DISCORD -->

                <a
                    href="YOUR-DISCORD-LINK-HERE"
                    target="_blank"
                    rel="noopener noreferrer"
                >

                    <svg
                        class="icon"
                        viewBox="0 0 24 24"
                    >

                        <path
                            fill="currentColor"
                            d="M20.3 4.4a19.8 19.8 0 0 0-4.9-1.5.1.1 0 0 0-.1.04c-.2.38-.4.77-.6 1.2a18.2 18.2 0 0 0-5.4 0c-.2-.43-.4-.82-.6-1.2a.1.1 0 0 0-.1-.04 19.8 19.8 0 0 0-4.9 1.5.1.1 0 0 0-.04.04C.6 8.2-.2 12.5.1 16.8a.1.1 0 0 0 .04.07 19.9 19.9 0 0 0 6 3 .1.1 0 0 0 .1-.03c.5-.7.9-1.4 1.2-2.1a.1.1 0 0 0-.04-.1 12.8 12.8 0 0 1-1.9-.9.1.1 0 0 1 0-.13l.4-.3a.1.1 0 0 1 .1 0c3.9 1.8 8.1 1.8 12 0a.1.1 0 0 1 .1 0l.4.3a.1.1 0 0 1 0 .13c-.6.35-1.2.65-1.9.9a.1.1 0 0 0-.04.1c.3.7.7 1.4 1.2 2.1a.1.1 0 0 0 .1.03 19.8 19.8 0 0 0 6-3 .1.1 0 0 0 .04-.07c.4-4.7-.8-9-3.5-12.4a.1.1 0 0 0-.06-.04ZM8 15.3c-1.2 0-2.1-1.1-2.1-2.4S6.8 10.5 8 10.5s2.2 1.1 2.2 2.4-.9 2.4-2.2 2.4Zm8 0c-1.2 0-2.1-1.1-2.1-2.4-.9-1.3-2.1-1.3-2.1-2.4s.9-2.4 2.1-2.4 2.2 1.1 2.2 2.4-.9 2.4-2.2 2.4Z"
                        />

                    </svg>

                    <span>Discord</span>

                </a>


                <!-- YOUTUBE -->

                <a
                    href="YOUR-YOUTUBE-LINK-HERE"
                    target="_blank"
                    rel="noopener noreferrer"
                >

                    <svg
                        class="icon"
                        viewBox="0 0 24 24"
                    >

                        <path
                            fill="currentColor"
                            d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.6 15.7V8.3l6.4 3.7-6.4 3.7Z"
                        />

                    </svg>

                    <span>YouTube</span>

                </a>


                <!-- GET MODS -->

                <a
                    href="#downloads"
                    class="get-mods-nav"
                >
                    Get Mods
                </a>


            </nav>

        </div>

    </header>


    <!-- =========================
         HOME
    ========================= -->

    <main>

        <section id="home">

            <div class="hero-content">

                <h1 class="hero-title">
                    <span>VanillaMods</span>
                </h1>

                <p class="hero-subtitle">
                    Get The Best Mods For Your Game!
                </p>

            </div>

        </section>

    </main>


    <!-- =========================
         SPACE BACKGROUND
    ========================= -->

    <div id="space">

        <div class="purple-cloud cloud1"></div>

        <div class="purple-cloud cloud2"></div>

        <div class="purple-cloud cloud3"></div>

        <div class="purple-cloud cloud4"></div>

    </div>


    <script>

        const space =
            document.getElementById("space");


        /* =========================
           NORMAL STARS
        ========================= */

        const starCount = 320;


        for (
            let i = 0;
            i < starCount;
            i++
        ) {

            const star =
                document.createElement("div");


            star.classList.add("star");


            const size =
                Math.random();


            if (size > 0.90) {

                star.classList.add("big");

            }

            else if (size < 0.35) {

                star.classList.add("small");

            }


            star.style.left =
                Math.random() * 100 + "%";


            star.style.top =
                Math.random() * 100 + "%";


            star.style.setProperty(
                "--opacity",
                0.25 +
                Math.random() * 0.75
            );


            star.style.setProperty(
                "--twinkle-time",
                1.5 +
                Math.random() * 5 +
                "s"
            );


            star.style.animationDelay =
                Math.random() * 5 +
                "s";


            space.appendChild(star);

        }


        /* =========================
           MOVING STARS
        ========================= */

        function createMovingStar() {

            const star =
                document.createElement("div");


            star.classList.add(
                "moving-star"
            );


            let startX;
            let startY;


            if (Math.random() < 0.5) {

                startX =
                    Math.random() * 100;

                startY = -2;

            }

            else {

                startX = -2;

                startY =
                    Math.random() * 100;

            }


            star.style.left =
                startX + "%";


            star.style.top =
                startY + "%";


            const moveX =
                100 +
                Math.random() * 550;


            const moveY =
                -150 +
                Math.random() * 700;


            star.style.setProperty(
                "--move-x",
                moveX + "px"
            );


            star.style.setProperty(
                "--move-y",
                moveY + "px"
            );


            star.style.setProperty(
                "--move-time",
                3 +
                Math.random() * 5 +
                "s"
            );


            space.appendChild(star);


            setTimeout(() => {

                star.remove();

            }, 9000);

        }


        setInterval(() => {

            if (
                Math.random() < 0.8
            ) {

                createMovingStar();

            }

        }, 1000);


        /* =========================
           SHOOTING STARS
        ========================= */

        function createShootingStar() {

            const star =
                document.createElement("div");


            star.classList.add(
                "shooting-star"
            );


            star.style.left =
                Math.random() * 55 +
                "%";


            star.style.top =
                Math.random() * 35 +
                "%";


            space.appendChild(star);


            setTimeout(() => {

                star.remove();

            }, 1300);

        }


        function randomShootingStar() {

            createShootingStar();


            const next =
                3000 +
                Math.random() * 5000;


            setTimeout(
                randomShootingStar,
                next
            );

        }


        randomShootingStar();

    </script>

</body>
</html>
